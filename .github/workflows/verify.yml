name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # M0 — 追加の道具が要らない。clean clone で必ず動く
  structure:
    name: structure (M0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm run check:structure
      - run: npm run check:neutrality

  # M1 — mise を入れて測り直し、expected.md と突き合わせる
  #
  # 🔴 matrix の leg ごとに timeout-minutes が効く。leg を増やすときは
  #    ハング時の消費が leg 数だけ倍になることを見込む。
  scenarios:
    name: scenarios (M1)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [structure]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: jdx/mise-action@v4
        with:
          install: false

      - name: 版を記録する
        run: bash scripts/env.sh

      - name: M1 シナリオを実行する
        run: |
          set -euo pipefail
          found=0
          for d in scenarios/*/; do
            grep -qE '^#[[:space:]]*mode:[[:space:]]*M1' "$d/run.sh" || continue
            echo "::group::$(basename "$d")"
            bash "$d/run.sh"
            echo "::endgroup::"
            found=$((found + 1))
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::M1 シナリオが 1 本もありません"
            exit 1
          fi
          echo "M1 シナリオ $found 本を実行しました"

      - name: 測り直した値を突き合わせる
        run: npm run check:provenance

      - name: 生ログを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}
          path: scenarios/*/results/
          if-no-files-found: error

  # 公開側でのみ走る。コミットの author / committer が公開用 identity かを見る。
  identity:
    name: commit identity
    if: github.repository_owner == 'VisionNurture-com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 公開用 identity 以外のコミットが無いことを確かめる
        run: |
          set -euo pipefail
          expected='TechBizPlusD <blog@techbizplusd.com>'
          bad="$(git log --format='%H%x09%an <%ae>%x09%cn <%ce>' \
                 | awk -F'\t' -v e="$expected" '$2 != e || $3 != e')"
          if [ -n "$bad" ]; then
            echo "::error::公開用 identity 以外のコミットがあります（期待: $expected）"
            echo "$bad"
            exit 1
          fi
          echo "全コミットが $expected です"
